# Versiones de ArgosIsp (A6, distribución) con release-please:
#
# 1. Cada push a main actualiza (o abre) la PR "chore: publicar versión X.Y.Z" con la versión que
#    sale de los Conventional Commits (feat → menor, fix → parche, `!`/BREAKING CHANGE → mayor) y el
#    CHANGELOG.md en español (secciones en release-please-config.json).
# 2. Al mergear esa PR, release-please crea la etiqueta vX.Y.Z y la GitHub Release con las notas de
#    esa versión, y este workflow llama a imagenes.yml: imágenes en GHCR, `estable` y el paquete de
#    instalación en la Release.
#
# La PR de release-please la abre GITHUB_TOKEN, así que el CI no corre solo en ella: ciérrala y
# vuelve a abrirla (o corre CI con workflow_dispatch en su rama) antes de mergear (CLAUDE.md, §12).
name: Versión

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    outputs:
      creada: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  imagenes:
    name: Imágenes y paquete
    needs: release-please
    if: needs.release-please.outputs.creada == 'true'
    uses: ./.github/workflows/imagenes.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: write
      packages: write
