# Imágenes de producción de ArgosIsp (A6, distribución): construye y publica en GHCR las siete
# imágenes multi-arquitectura (linux/amd64 y linux/arm64) de una versión, cada arquitectura en su
# runner nativo y unidas en una lista por `docker buildx imagetools create`, mueve `estable` cuando
# están TODAS y sube a la GitHub Release el paquete de instalación (infra/produccion/empaquetar.sh).
#
# Se dispara:
#   - desde release.yml (workflow_call) cuando release-please publica una versión. La etiqueta que
#     crea release-please con GITHUB_TOKEN no dispara `push: tags` (regla de GitHub), así que no hay
#     dos corridas;
#   - al empujar a mano una etiqueta vMAYOR.MENOR.PARCHE;
#   - a mano (workflow_dispatch) para volver a publicar una versión existente.
#
# Solo GITHUB_TOKEN (packages: write para GHCR, contents: write para la Release). Ningún secreto.
name: Imágenes

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_call:
    inputs:
      version:
        description: Versión sin la v (1.4.2)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Versión sin la v (1.4.2); la etiqueta v<versión> debe existir
        type: string
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: imagenes-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  preparar:
    name: Versión
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      registro: ${{ steps.v.outputs.registro }}
      commit: ${{ steps.v.outputs.commit }}
      fecha: ${{ steps.v.outputs.fecha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
          fetch-depth: 1
      - id: v
        env:
          ENTRADA: ${{ inputs.version || github.ref_name }}
        run: |
          version="${ENTRADA#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versión inválida: $ENTRADA (MAYOR.MENOR.PARCHE)"
            exit 1
          fi
          # GHCR exige minúsculas: ghcr.io/hcdestroyer
          {
            echo "version=$version"
            echo "registro=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "commit=$(git rev-parse HEAD)"
            echo "fecha=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  # Cada imagen se compila en su arquitectura, en un runner nativo (sin QEMU): amd64 en
  # ubuntu-24.04 y arm64 en ubuntu-24.04-arm (el mismo de `distribucion` en ci.yml). Cada build sube
  # su imagen solo por digest (sin etiqueta); `manifiesto` une los dos digests en la lista
  # multiarquitectura <registro>/argosisp-<imagen>:<versión> con `docker buildx imagetools create`.
  # Con QEMU, api, web y portal (Node) y FreeRADIUS (compila) tardaban más de 70 min en arm64.
  construir:
    name: ${{ matrix.imagen }} (${{ matrix.arch }})
    needs: preparar
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # FreeRADIUS se compila: sin caché tarda más que las de Node
    timeout-minutes: ${{ matrix.imagen == 'freeradius' && 120 || 60 }}
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        imagen: [api, web, portal, aaa, coa, backup, freeradius, wireguard]
        include:
          - { imagen: api, dockerfile: apps/api/Dockerfile, contexto: . }
          - { imagen: web, dockerfile: apps/web/Dockerfile, contexto: . }
          - { imagen: portal, dockerfile: apps/portal/Dockerfile, contexto: . }
          - { imagen: aaa, dockerfile: services/aaa/Dockerfile, contexto: . }
          - { imagen: coa, dockerfile: services/coa/Dockerfile, contexto: . }
          - { imagen: backup, dockerfile: infra/backups/Dockerfile, contexto: . }
          - { imagen: wireguard, dockerfile: infra/wireguard/Dockerfile, contexto: . }
          # La oficial freeradius/freeradius-server solo existe para amd64 (infra/freeradius)
          - { imagen: freeradius, dockerfile: infra/freeradius/Dockerfile, contexto: infra/freeradius }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.preparar.outputs.version }}

      - name: Arquitectura del runner
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          servidor="$(docker version --format '{{.Server.Arch}}')"
          echo "uname -m: $(uname -m) · docker: $servidor"
          [ "$servidor" = "$ARCH" ] || { echo "::error::el runner es $servidor y se esperaba $ARCH"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.preparar.outputs.registro }}/argosisp-${{ matrix.imagen }}
          labels: |
            org.opencontainers.image.title=argosisp-${{ matrix.imagen }}
            org.opencontainers.image.version=${{ needs.preparar.outputs.version }}
            org.opencontainers.image.revision=${{ needs.preparar.outputs.commit }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Solo por digest: la etiqueta de la versión la pone `manifiesto` cuando están las dos
          outputs: type=image,name=${{ needs.preparar.outputs.registro }}/argosisp-${{ matrix.imagen }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ARGOSISP_VERSION=${{ needs.preparar.outputs.version }}
            ARGOSISP_COMMIT=${{ needs.preparar.outputs.commit }}
            ARGOSISP_COMPILADA=${{ needs.preparar.outputs.fecha }}
          cache-from: type=gha,scope=imagen-${{ matrix.imagen }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=imagen-${{ matrix.imagen }}-${{ matrix.arch }}

      - name: Guardar el digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest inválido: '$DIGEST'"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.imagen }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  manifiesto:
    name: ${{ matrix.imagen }} (manifiesto amd64 + arm64)
    needs: [preparar, construir]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        imagen: [api, web, portal, aaa, coa, backup, freeradius, wireguard]
    env:
      IMAGEN: ${{ needs.preparar.outputs.registro }}/argosisp-${{ matrix.imagen }}
      VERSION: ${{ needs.preparar.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.imagen }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lista multiarquitectura ${{ needs.preparar.outputs.version }}
        run: |
          amd64="$(cat "$RUNNER_TEMP/digests/amd64")"
          arm64="$(cat "$RUNNER_TEMP/digests/arm64")"
          docker buildx imagetools create -t "$IMAGEN:$VERSION" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=${{ needs.preparar.outputs.commit }}" \
            "$IMAGEN@$amd64" "$IMAGEN@$arm64"

      - name: Comprobar las dos arquitecturas
        run: |
          plataformas="$(docker buildx imagetools inspect --raw "$IMAGEN:$VERSION" |
            jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | unique | join(" ")')"
          echo "$IMAGEN:$VERSION → $plataformas"
          [ "$plataformas" = "amd64 arm64" ] || { echo "::error::$IMAGEN:$VERSION tiene '$plataformas' (se esperaba amd64 arm64)"; exit 1; }

  estable:
    name: Canal estable y paquete de instalación
    needs: [preparar, manifiesto]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.preparar.outputs.version }}
      REGISTRO: ${{ needs.preparar.outputs.registro }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.preparar.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `estable` solo se mueve hacia adelante: volver a publicar una versión vieja no la baja.
      - name: Mover `estable` a ${{ needs.preparar.outputs.version }}
        run: |
          ultima="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName \
            --jq '.[].tagName' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          if [ -n "$ultima" ] && [ "$(printf '%s\n%s\n' "$ultima" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "::notice::$VERSION es anterior a $ultima: estable no se mueve"
            exit 0
          fi
          for imagen in api web portal aaa coa backup freeradius wireguard; do
            docker buildx imagetools create -t "$REGISTRO/argosisp-$imagen:estable" "$REGISTRO/argosisp-$imagen:$VERSION"
          done

      # El paquete va al final: `argosisp actualizar` e `instalar.sh` solo ven una versión cuando su
      # paquete está publicado, y para entonces las siete imágenes ya existen.
      - name: Paquete de instalación en la Release v${{ needs.preparar.outputs.version }}
        run: |
          infra/produccion/empaquetar.sh "$VERSION" dist
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            # Etiqueta empujada a mano (sin release-please): notas generadas por GitHub
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
          fi
          gh release upload "v$VERSION" dist/* --clobber
