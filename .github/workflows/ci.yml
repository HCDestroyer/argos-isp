name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: lint, typecheck, pruebas, build y contratos
    runs-on: ubuntu-24.04
    # La suite de apps/api (más de 1400 pruebas contra Postgres) ya tarda ~24 min en el runner y el
    # trabajo completo ~35 min con el panel, el respaldo, el build y los contratos.
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: argosisp
          POSTGRES_PASSWORD: argosisp
          POSTGRES_DB: argosisp_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argosisp -d argosisp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # SMTP de prueba: la prueba de aceptación de notify (factura emitida → correo < 10 s)
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    # Variables que usan las pruebas de integración de apps/api (Japa) contra los servicios.
    env:
      NODE_ENV: test
      TZ: UTC
      HOST: 127.0.0.1
      PORT: "3333"
      LOG_LEVEL: warn
      APP_KEY: ci-app-key-solo-pruebas-0123456789abcdef
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: argosisp
      DB_PASSWORD: argosisp
      DB_DATABASE: argosisp_test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAILPIT_API: http://localhost:8025
      # Prefijo propio de BullMQ para las pruebas
      COLAS_PREFIJO: argosisp-ci

    steps:
      - uses: actions/checkout@v5

      # Versión de pnpm desde "packageManager" del package.json raíz
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Permisos del frontend existen en el ACL
        run: pnpm verificar:permisos

      - name: Pruebas
        run: pnpm test

      # Ciclo completo de infra/backups sobre la base que dejaron las pruebas: dump → base nueva →
      # filas por tabla iguales al dump y a la base de origen → migraciones al día. Incluye el tar de
      # los comprobantes que subieron las pruebas (COMPROBANTES_DIR por defecto de apps/api).
      - name: Respaldo y restauración
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: argosisp
          PGPASSWORD: argosisp
          BACKUP_BASE: argosisp_test
          BACKUP_DIR: ${{ runner.temp }}/respaldos
          DB_OWNER_USER: argosisp
          COMPROBANTES_DIR: apps/api/storage/comprobantes
        run: |
          pg_dump --version
          mkdir -p "$COMPROBANTES_DIR"
          infra/backups/respaldar.sh
          infra/backups/restaurar.sh "$(ls "$BACKUP_DIR"/argosisp_test-*.dump)" \
            --base argosisp_restaurada --comparar-con argosisp_test \
            --comprobantes-dir "$RUNNER_TEMP/comprobantes-restaurados" \
            --migrar 'cd apps/api && node ace migration:run --force'
          diff -r "$COMPROBANTES_DIR" "$RUNNER_TEMP/comprobantes-restaurados"

      - name: Build
        run: pnpm build

      - name: Regenerar contratos (OpenAPI → packages/contracts)
        run: pnpm contracts:build

      - name: Contratos commiteados
        run: |
          if ! git diff --exit-code -- packages/contracts \
            || [ -n "$(git status --porcelain --untracked-files=all -- packages/contracts)" ]; then
            echo "::error::packages/contracts cambió al regenerarlo. Corre 'pnpm contracts:build' y commitea el resultado."
            git status --short -- packages/contracts
            exit 1
          fi

  infra:
    name: docker compose y FreeRADIUS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: docker compose config
        run: |
          docker compose -f infra/docker-compose.yml --env-file infra/.env.example config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.portal-https.yml --env-file infra/.env.example config --quiet
          docker compose -f infra/produccion/docker-compose.produccion.yml --env-file infra/produccion/.env.example config --quiet
          COMPOSE_PROFILES=api-portal ARGOSISP_API_PORTAL_DESTINO=api-portal \
            docker compose -f infra/produccion/docker-compose.produccion.yml --env-file infra/produccion/.env.example config --quiet
          docker compose -f infra/produccion/docker-compose.nodo-portal.yml --env-file infra/produccion/nodo-portal.env.example config --quiet
          # WireGuard de los routers (perfil wireguard; contratos/conexion-routers.md)
          COMPOSE_PROFILES=lab,wireguard docker compose -f infra/docker-compose.yml --env-file infra/.env.example config --quiet
          COMPOSE_PROFILES=wireguard ARGOSISP_WIREGUARD=1 RADIUS_BIND_IP=10.255.0.1 \
            docker compose -f infra/produccion/docker-compose.produccion.yml --env-file infra/produccion/.env.example config --quiet
          COMPOSE_PROFILES=wireguard docker compose -f infra/produccion/docker-compose.produccion.yml \
            --env-file infra/produccion/.env.example config --services | grep -qx wireguard-agente

      # PORTAL_PROXIES_CONFIABLES sigue a COMPOSE_SUBNET_V4/V6 (compose resuelto y con sockets)
      - name: La API confía en la red de compose con cualquier COMPOSE_SUBNET
        run: |
          shellcheck infra/ci/probar-red-compose.sh
          infra/ci/probar-red-compose.sh

      # Scripts de RouterOS (infra/mikrotik): lab.rsc y plantillas armados desde sus piezas, variables,
      # escape de secretos y llaves balanceadas. El /import real se prueba en CHR (README de mikrotik).
      - name: Plantillas de RouterOS (armado y render)
        run: |
          node infra/mikrotik/armar.mjs --verificar
          node --test infra/mikrotik/render.test.mjs
          # La imagen de la API copia lo que lee el render (la prueba con la imagen va en distribucion)
          grep -q '^COPY .*infra/mikrotik/variables.json /app/mikrotik/' apps/api/Dockerfile
          grep -q '^COPY .*infra/mikrotik/plantillas/ /app/mikrotik/plantillas/' apps/api/Dockerfile
          grep -q '^ENV ROUTERS_MIKROTIK_DIR=/app/mikrotik' apps/api/Dockerfile

      # Servidor WireGuard: peer por evento, handshake y estado a la API (falsa), contenedor → router
      # por el túnel con origen .1, firewall del túnel (solo RADIUS), rotación (infra/wireguard/probar.sh)
      - name: Servidor WireGuard (prueba de humo)
        run: |
          shellcheck infra/wireguard/*.sh
          infra/wireguard/probar.sh

      - name: radiusd -XC
        run: infra/ci/freeradius-check.sh

      - name: Reglas de Prometheus (promtool check y test)
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /m/reglas.yml
          docker run --rm -v "$PWD/infra/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.5.0 test rules /m/reglas.test.yml

      - name: Alertmanager (amtool check-config)
        run: infra/ci/alertmanager-check.sh

      # Criterio de la semana 3: Prometheus → Alertmanager → Telegram (simulado) en menos de un minuto
      - name: Alertas de punta a punta (Telegram simulado)
        run: infra/monitoring/probar-alertas.sh

      - name: Proxy pasa el cuerpo crudo del webhook de la pasarela
        run: infra/proxy/probar-webhook.sh

      # Node del runner (sin setup-node): solo corre un servidor de eco
      - name: Proxy del portal (/corte por HTTP, /entrar y /cuenta por HTTPS con HSTS)
        run: infra/proxy/probar-portal.sh

      # Caddyfile de producción detrás de Nginx Proxy Manager (ARGOSISP_PROXIES_CONFIABLES):
      # X-Forwarded-For solo desde la red de confianza; sin la variable, como siempre
      - name: Proxy de producción detrás de otro proxy (IP real del cliente)
        run: |
          shellcheck infra/ci/probar-detras-de-proxy.sh
          infra/ci/probar-detras-de-proxy.sh

  # Ensayo de restauración (A6): respaldo de un compose con datos de demo → compose limpio →
  # restaurar.sh → migrate + API → login, clientes y estado de cuenta (infra/backups/ensayo.sh).
  ensayo-restauracion:
    name: Ensayo de restauración del respaldo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Solo node para scripts/demo/datos.mjs (sin dependencias); sin caché de pnpm, que no se instala aquí
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: infra/backups/ensayo.sh --demo
        run: infra/backups/ensayo.sh --demo --construir

  # Distribución (A6; PLAN, "Distribución e instalación"): las siete imágenes de producción
  # construidas aquí (sin publicar) → instalar.sh → actualizar → actualización rota que revierte sola
  # con el respaldo → argosisp revertir → api-portal → nodo portal. Detalle en
  # infra/ci/probar-distribucion.sh. Dos arquitecturas en paralelo, cada una en su runner nativo (sin
  # QEMU): amd64 y arm64 (Raspberry Pi; ubuntu-24.04-arm). El nombre de amd64 no cambia (checks
  # requeridos).
  distribucion:
    name: ${{ matrix.arch == 'amd64' && 'Instalar, actualizar y revertir (imágenes de producción)' || format('Instalar, actualizar y revertir (imágenes de producción, {0})', matrix.arch) }}
    runs-on: ${{ matrix.runner }}
    # Sin caché, la primera corrida compila FreeRADIUS además de las seis de Node
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRO: ghcr.io/hcdestroyer
    steps:
      - uses: actions/checkout@v5

      - name: Arquitectura del runner
        run: |
          echo "uname -m: $(uname -m) · docker: $(docker version --format '{{.Server.Arch}}')"
          case "${{ matrix.arch }}:$(docker version --format '{{.Server.Arch}}')" in
            amd64:amd64 | arm64:arm64) ;;
            *) echo "::error::el runner no es ${{ matrix.arch }}"; exit 1 ;;
          esac

      - name: Scripts (bash -n y shellcheck)
        if: matrix.arch == 'amd64'
        run: |
          for s in infra/produccion/argosisp infra/produccion/instalar.sh infra/produccion/empaquetar.sh infra/ci/probar-distribucion.sh infra/ci/e2e-final.sh; do
            bash -n "$s"
          done
          shellcheck -x infra/produccion/argosisp infra/produccion/instalar.sh infra/produccion/empaquetar.sh infra/ci/probar-distribucion.sh infra/ci/e2e-final.sh

      - uses: docker/setup-buildx-action@v3

      # Mismos Dockerfiles y build-args que imagenes.yml; `load` las deja en el Docker del runner,
      # en su arquitectura nativa. Caché por arquitectura.
      - name: Imagen api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ env.REGISTRO }}/argosisp-api:0.0.1
          build-args: |
            ARGOSISP_VERSION=0.0.1
            ARGOSISP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci-api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-api-${{ matrix.arch }}
      - name: Imagen web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: ${{ env.REGISTRO }}/argosisp-web:0.0.1
          build-args: |
            ARGOSISP_VERSION=0.0.1
            ARGOSISP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci-web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-web-${{ matrix.arch }}
      - name: Imagen portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile
          load: true
          tags: ${{ env.REGISTRO }}/argosisp-portal:0.0.1
          build-args: |
            ARGOSISP_VERSION=0.0.1
            ARGOSISP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci-portal-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-portal-${{ matrix.arch }}
      - name: Imagen aaa
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/aaa/Dockerfile
          load: true
          tags: ${{ env.REGISTRO }}/argosisp-aaa:0.0.1
          build-args: |
            ARGOSISP_VERSION=0.0.1
            ARGOSISP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci-aaa-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-aaa-${{ matrix.arch }}
      - name: Imagen coa
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/coa/Dockerfile
          load: true
          tags: ${{ env.REGISTRO }}/argosisp-coa:0.0.1
          build-args: |
            ARGOSISP_VERSION=0.0.1
            ARGOSISP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci-coa-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-coa-${{ matrix.arch }}
      - name: Imagen backup
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/backups/Dockerfile
          load: true
          tags: ${{ env.REGISTRO }}/argosisp-backup:0.0.1
          build-args: |
            ARGOSISP_VERSION=0.0.1
            ARGOSISP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci-backup-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-backup-${{ matrix.arch }}
      - name: Imagen freeradius
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/freeradius/Dockerfile
          load: true
          tags: ${{ env.REGISTRO }}/argosisp-freeradius:0.0.1
          build-args: |
            ARGOSISP_VERSION=0.0.1
            ARGOSISP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci-freeradius-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-freeradius-${{ matrix.arch }}

      - name: instalar → actualizar → reversión automática → revertir → nodo portal
        env:
          ARGOSISP_REGISTRO: ${{ env.REGISTRO }}
        run: infra/ci/probar-distribucion.sh

  # Flujos críticos del panel con Playwright (A4), en modo fixtures (sin backend): el webServer de
  # apps/web/playwright.config.ts levanta `nuxt dev` con NUXT_PUBLIC_USE_FIXTURES=true.
  #
  # Escritorio y teléfono corren en paralelo y cada uno en tres partes (--shard), cada parte en su
  # runner: un proyecto entero ya pasaba los 25 minutos y una mitad llegó a 25 en un runner lento.
  # El trabajo «Playwright del panel (fixtures)» de abajo reúne todas las partes y conserva el
  # nombre del chequeo de siempre.
  e2e-panel-proyecto:
    name: Playwright del panel (${{ matrix.proyecto }} ${{ matrix.parte }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        proyecto: [escritorio, telefono]
        parte: [1, 2, 3]
    env:
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @argosisp/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Navegadores en caché por versión de Playwright: solo se descargan cuando cambia la versión.
      - name: Caché de navegadores
        id: cache-navegadores
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Instalar Chromium
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: pnpm --filter @argosisp/web exec playwright install --with-deps chromium

      - name: Dependencias del sistema de Chromium
        if: steps.cache-navegadores.outputs.cache-hit == 'true'
        run: pnpm --filter @argosisp/web exec playwright install-deps chromium

      - name: Playwright
        run: pnpm --filter @argosisp/web test:e2e --project=${{ matrix.proyecto }} --shard=${{ matrix.parte }}/3

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.proyecto }}-${{ matrix.parte }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  e2e-panel:
    name: Playwright del panel (fixtures)
    runs-on: ubuntu-24.04
    needs: e2e-panel-proyecto
    if: always()
    steps:
      - name: Escritorio y teléfono en verde, las tres partes
        env:
          RESULTADO: ${{ needs.e2e-panel-proyecto.result }}
        run: |
          echo "Playwright por proyecto: $RESULTADO"
          [ "$RESULTADO" = "success" ]
