name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: lint, typecheck, pruebas, build y contratos
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: argosisp
          POSTGRES_PASSWORD: argosisp
          POSTGRES_DB: argosisp_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argosisp -d argosisp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # SMTP de prueba: la prueba de aceptación de notify (factura emitida → correo < 10 s)
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    # Variables que usan las pruebas de integración de apps/api (Japa) contra los servicios.
    env:
      NODE_ENV: test
      TZ: UTC
      HOST: 127.0.0.1
      PORT: "3333"
      LOG_LEVEL: warn
      APP_KEY: ci-app-key-solo-pruebas-0123456789abcdef
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: argosisp
      DB_PASSWORD: argosisp
      DB_DATABASE: argosisp_test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAILPIT_API: http://localhost:8025
      # Prefijo propio de BullMQ para las pruebas
      COLAS_PREFIJO: argosisp-ci

    steps:
      - uses: actions/checkout@v5

      # Versión de pnpm desde "packageManager" del package.json raíz
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Permisos del frontend existen en el ACL
        run: pnpm verificar:permisos

      - name: Pruebas
        run: pnpm test

      # Ciclo completo de infra/backups sobre la base que dejaron las pruebas: dump → base nueva →
      # filas por tabla iguales al dump y a la base de origen → migraciones al día. Incluye el tar de
      # los comprobantes que subieron las pruebas (COMPROBANTES_DIR por defecto de apps/api).
      - name: Respaldo y restauración
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: argosisp
          PGPASSWORD: argosisp
          BACKUP_BASE: argosisp_test
          BACKUP_DIR: ${{ runner.temp }}/respaldos
          DB_OWNER_USER: argosisp
          COMPROBANTES_DIR: apps/api/storage/comprobantes
        run: |
          pg_dump --version
          mkdir -p "$COMPROBANTES_DIR"
          infra/backups/respaldar.sh
          infra/backups/restaurar.sh "$(ls "$BACKUP_DIR"/argosisp_test-*.dump)" \
            --base argosisp_restaurada --comparar-con argosisp_test \
            --comprobantes-dir "$RUNNER_TEMP/comprobantes-restaurados" \
            --migrar 'cd apps/api && node ace migration:run --force'
          diff -r "$COMPROBANTES_DIR" "$RUNNER_TEMP/comprobantes-restaurados"

      - name: Build
        run: pnpm build

      - name: Regenerar contratos (OpenAPI → packages/contracts)
        run: pnpm contracts:build

      - name: Contratos commiteados
        run: |
          if ! git diff --exit-code -- packages/contracts \
            || [ -n "$(git status --porcelain --untracked-files=all -- packages/contracts)" ]; then
            echo "::error::packages/contracts cambió al regenerarlo. Corre 'pnpm contracts:build' y commitea el resultado."
            git status --short -- packages/contracts
            exit 1
          fi

  infra:
    name: docker compose y FreeRADIUS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: docker compose config
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example config --quiet

      - name: radiusd -XC
        run: infra/ci/freeradius-check.sh

      - name: Reglas de Prometheus (promtool check y test)
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /m/reglas.yml
          docker run --rm -v "$PWD/infra/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.5.0 test rules /m/reglas.test.yml

      - name: Alertmanager (amtool check-config)
        run: infra/ci/alertmanager-check.sh

      # Criterio de la semana 3: Prometheus → Alertmanager → Telegram (simulado) en menos de un minuto
      - name: Alertas de punta a punta (Telegram simulado)
        run: infra/monitoring/probar-alertas.sh

      - name: Proxy pasa el cuerpo crudo del webhook de la pasarela
        run: infra/proxy/probar-webhook.sh

  # Ensayo de restauración (A6): respaldo de un compose con datos de demo → compose limpio →
  # restaurar.sh → migrate + API → login, clientes y estado de cuenta (infra/backups/ensayo.sh).
  ensayo-restauracion:
    name: Ensayo de restauración del respaldo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Solo node para scripts/demo/datos.mjs (sin dependencias); sin caché de pnpm, que no se instala aquí
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: infra/backups/ensayo.sh --demo
        run: infra/backups/ensayo.sh --demo --construir

  # Flujos críticos del panel con Playwright (A4), en modo fixtures (sin backend): el webServer de
  # apps/web/playwright.config.ts levanta `nuxt dev` con NUXT_PUBLIC_USE_FIXTURES=true.
  e2e-panel:
    name: Playwright del panel (fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @argosisp/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Navegadores en caché por versión de Playwright: solo se descargan cuando cambia la versión.
      - name: Caché de navegadores
        id: cache-navegadores
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Instalar Chromium
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: pnpm --filter @argosisp/web exec playwright install --with-deps chromium

      - name: Dependencias del sistema de Chromium
        if: steps.cache-navegadores.outputs.cache-hit == 'true'
        run: pnpm --filter @argosisp/web exec playwright install-deps chromium

      - name: Playwright
        run: pnpm --filter @argosisp/web test:e2e

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
