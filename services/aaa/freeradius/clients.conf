# -*- text -*-
#
#  Clientes RADIUS (NAS). Se monta en /etc/freeradius/clients.conf.
#  Los secrets vienen del entorno (infra/.env); nunca se escriben aquí.
#
#  A2 generará un archivo por router en clients.d/ desde network.routers con `pnpm aaa:clients`;
#  ese directorio se incluye al final (FreeRADIUS ignora archivos que empiezan con punto).

#  Pruebas locales dentro del contenedor (radtest/radclient) y healthcheck de docker compose.
client localhost {
	ipaddr = 127.0.0.1
	proto = *
	secret = "$ENV{RADIUS_LOCAL_SECRET}"
	nas_type = other
	require_message_authenticator = no
}

#  MikroTik del laboratorio (infra/mikrotik/lab.rsc). ipaddr es la IP de origen con la que el
#  router habla con el servidor (/radius src-address): la del túnel WireGuard o la de la LAN.
#  Docker conserva la IP de origen al publicar puertos UDP, así que coincide con la del router.
client mikrotik-lab {
	ipaddr = $ENV{RADIUS_LAB_NAS_IP}
	proto = udp
	secret = "$ENV{RADIUS_LAB_SECRET}"
	shortname = mikrotik-lab
	nas_type = other
	#  RouterOS 7.15+ envía Message-Authenticator (require-message-auth=yes-for-request-resp).
	require_message_authenticator = yes
	limit_proxy_state = yes
}

$INCLUDE clients.d/
