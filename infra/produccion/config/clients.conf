# Clientes de FreeRADIUS en producción (infra/produccion). Sin el cliente fijo del laboratorio
# (mikrotik-lab de services/aaa/freeradius/clients.conf): cada router sale de network.routers con
# `argosisp radius-clientes`, que escribe clients.d/router-<id>.conf (volumen radius-clientes).

# Healthcheck del contenedor y radtest local.
client localhost {
	ipaddr = 127.0.0.1
	proto = *
	secret = "$ENV{RADIUS_LOCAL_SECRET}"
	nas_type = other
	require_message_authenticator = no
}

$INCLUDE clients.d/
