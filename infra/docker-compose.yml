# ArgosIsp · entorno de desarrollo y laboratorio.
#
#   cp infra/.env.example infra/.env      # y completa los valores
#   docker compose -f infra/docker-compose.yml up -d postgres redis mailpit
#   docker compose -f infra/docker-compose.yml up -d            # todo (perfil lab si COMPOSE_PROFILES=lab)
#
# Perfil "lab": freeradius, aaa y coa. FreeRADIUS publica UDP 1812/1813 en RADIUS_BIND_IP
# (127.0.0.1 por defecto; en el laboratorio, la IP del servidor en la LAN o en el túnel WireGuard
# hacia el MikroTik). Detalle en infra/mikrotik/README.md.
#
# Los builds usan como contexto la raíz del repo (..), con el Dockerfile de cada app o servicio.

name: argosisp

x-node-healthcheck: &node-healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

# Healthcheck de los procesos de fondo (cada servicio agrega su `test`).
x-proceso-vivo: &proceso-vivo
  interval: 30s
  timeout: 3s
  retries: 3
  start_period: 30s

# Entorno común de la imagen de api (migrate, api y procesos de fondo).
x-api-env: &api-env
  # La imagen de api es un build de producción (sin devDependencies como pino-pretty).
  NODE_ENV: production
  TZ: UTC
  HOST: 0.0.0.0
  PORT: '3333'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${API_PUBLIC_URL:-http://localhost:3333}
  # Conector Horus (A6, contratos/horus.md): receptor de webhooks y enlace de conexión. El conector
  # se configura desde el panel; HORUS_PERMITIR_HTTP=true solo en laboratorio (Horus sin TLS).
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3333}
  HORUS_PERMITIR_HTTP: ${HORUS_PERMITIR_HTTP:-false}
  # URL con la que el navegador llega al panel: autologin de Horus (/sso/entrar) y redirección del
  # enlace de conexión (GET /conectar de la API → <panel>/conectar). Sin ella, 503 en producción.
  PANEL_URL_PUBLICA: ${PANEL_URL_PUBLICA:-http://localhost:${WEB_PORT_HOST:-3000}}
  DB_HOST: postgres
  DB_PORT: '5432'
  # Usuario de la aplicación: miembro de argosisp_app, sin DDL ni UPDATE/DELETE en ledger y audit
  # (infra/postgres/usuarios.sh). migrate lo reemplaza por el dueño.
  DB_USER: ${DB_APP_USER:-argosisp_api}
  DB_PASSWORD: ${DB_APP_PASSWORD:-argosisp_api}
  DB_DATABASE: argosisp
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  MAIL_FROM: ${MAIL_FROM:-ArgosIsp <no-responder@argosisp.example>}
  # Notificaciones (apps/api/app/notify). Sin TELEGRAM_BOT_TOKEN el canal Telegram no se usa
  # y los clientes con esa preferencia reciben correo.
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  # Raíz de la Bot API (vacío = https://api.telegram.org); la misma usa alertmanager
  TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-}
  # Bot (POST /api/v1/telegram/webhook, contratos/telegram.md): usuario del bot sin @, secreto del
  # header X-Telegram-Bot-Api-Secret-Token y URL pública HTTPS para `node ace telegram:webhook`.
  TELEGRAM_BOT_NOMBRE: ${TELEGRAM_BOT_NOMBRE:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
  TELEGRAM_CODIGO_VIGENCIA_S: ${TELEGRAM_CODIGO_VIGENCIA_S:-900}
  # Alertas internas (app/notify/alertas.ts): chat del equipo y gracia de los crons vigilados
  TELEGRAM_CHAT_EQUIPO: ${TELEGRAM_CHAT_EQUIPO:-}
  # Avisos fiscales a contabilidad (valor inicial; después en el panel, correo.contabilidad)
  NOTIFY_CORREO_CONTABILIDAD: ${NOTIFY_CORREO_CONTABILIDAD:-}
  NOTIFY_CRON_TOLERANCIA_MIN: ${NOTIFY_CRON_TOLERANCIA_MIN:-30}
  NOTIFY_EMPRESA_NOMBRE: ${NOTIFY_EMPRESA_NOMBRE:-ArgosIsp}
  NOTIFY_EMPRESA_TELEFONO: ${NOTIFY_EMPRESA_TELEFONO:-}
  NOTIFY_PORTAL_URL: ${NOTIFY_PORTAL_URL:-}
  # Token de GET /internal/aaa/servicio; el mismo valor que usa services/aaa.
  INTERNAL_TOKEN: ${AAA_INTERNAL_TOKEN:-}
  # Bearer de GET /metrics (Prometheus, perfil monitoreo). Vacío = /metrics responde 404.
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  AAA_PPP_KEY: ${AAA_PPP_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
  # /portal/quien-soy: confiar en X-Forwarded-For solo si la conexión viene de la red de compose
  # (el portal reenvía /api/v1/portal/** y agrega la IP del cliente al final de la cadena).
  PORTAL_PROXIES_CONFIABLES: ${PORTAL_PROXIES_CONFIABLES:-172.30.0.0/24,fd00:a6:30::/64}
  PORTAL_CABECERA_IP: x-forwarded-for
  # Cookie de sesión del portal con Secure: auto (si llegó por HTTPS) o siempre (producción, con el
  # portal por HTTPS: docker-compose.portal-https.yml la pone en siempre).
  PORTAL_COOKIE_SEGURA: ${PORTAL_COOKIE_SEGURA:-auto}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  # Pasarela de pago en línea (A3, app/billing/pasarelas; a3.md). La imagen corre con
  # NODE_ENV=production: sin PASARELA_PROVEEDOR no hay pasarela (503). En el laboratorio,
  # PASARELA_PROVEEDOR=falsa con su secreto HMAC y la URL pública de la API (página de pago simulada).
  # El webhook del proveedor entra por POST /api/v1/pasarela/webhook/<proveedor>: el proxy debe
  # pasar el cuerpo crudo (servicio proxy, infra/proxy/Caddyfile). billing-worker corre el cron
  # diario de conciliación con estas mismas variables.
  PASARELA_PROVEEDOR: ${PASARELA_PROVEEDOR:-}
  PASARELA_FALSA_SECRETO: ${PASARELA_FALSA_SECRETO:-}
  PASARELA_URL_PUBLICA: ${PASARELA_URL_PUBLICA:-${API_PUBLIC_URL:-http://localhost:3333}}
  # URL con que el cliente abre el portal (la misma del servicio portal): el pago en línea devuelve
  # al cliente a <PORTAL_URL_PUBLICA>/corte?pago=<id> (A5). Vacía = NOTIFY_PORTAL_URL.
  PORTAL_URL_PUBLICA: ${PORTAL_URL_PUBLICA:-}
  # Orígenes a los que la pasarela puede devolver al cliente (A3; separados por coma). Por defecto,
  # el del portal: sin él, el cliente no vuelve al portal después de pagar.
  PASARELA_RETORNO_ORIGENES: ${PASARELA_RETORNO_ORIGENES:-${PORTAL_URL_PUBLICA:-}}
  # Comprobantes de depósito (A3, billing/comprobantes_archivos.ts): fuera de Postgres, en el volumen
  # `comprobantes` (o COMPROBANTES_HOST_DIR) montado solo en api, que los guarda y los sirve
  # (el portal los sube y los pide a través de la API). El servicio backup los respalda.
  COMPROBANTES_DIR: /comprobantes

# Procesos de fondo con la imagen de api (relay, billing-worker, fiscal-worker, sesiones-worker, routeros-worker,
# aaa-vigia, worker).
x-proceso-fondo: &proceso-fondo
  image: argosisp/api:${IMAGE_TAG:-dev}
  build:
    context: ..
    dockerfile: apps/api/Dockerfile
  restart: unless-stopped
  environment: *api-env
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: argosisp
      # Superusuario: solo administración y la base de pruebas argosisp_test. Ninguna app lo usa.
      POSTGRES_USER: argosisp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-argosisp}
      TZ: UTC
      # Usuarios que crea usuarios.sh: dueño (migrate) y aplicación (api, workers, coa)
      DB_OWNER_USER: ${DB_OWNER_USER:-argosisp_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-argosisp_owner}
      DB_APP_USER: ${DB_APP_USER:-argosisp_api}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-argosisp_api}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./postgres/usuarios.sh:/docker-entrypoint-initdb.d/20-usuarios.sh:ro
    ports:
      - 127.0.0.1:${DB_PORT_HOST:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U argosisp -d argosisp]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    # Sin TTL ni expulsión: la caché se invalida por evento (CLAUDE.md, regla 5) y BullMQ exige
    # noeviction. maxmemory 0 = sin límite. AOF para no perder colas ni streams al reiniciar.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - '0'
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    ports:
      - 127.0.0.1:${REDIS_PORT_HOST:-6379}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      TZ: UTC
    ports:
      - 127.0.0.1:${SMTP_PORT_HOST:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT_HOST:-8025}:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 3s
      retries: 5

  # Respaldo diario de Postgres y de los comprobantes (infra/backups, infra/README.md "Respaldos"):
  # pg_dump y tar de /comprobantes a BACKUP_HOST_DIR
  # (un disco externo o NFS montado en el host), retención por días, cifrado con age y copia con rclone
  # opcionales. Restaurar: docker compose run --rm backup restaurar.sh /backups/<archivo> ...
  backup:
    image: argosisp/backup:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: infra/backups/Dockerfile
    restart: unless-stopped
    # La imagen corre como `respaldo` (uid 1000). En desarrollo y en el ensayo, BACKUP_HOST_DIR es una
    # carpeta del host con otro dueño: root, como antes. Producción usa el de la imagen
    # (infra/produccion/docker-compose.produccion.yml, servicio `permisos`).
    user: ${BACKUP_USUARIO:-0:0}
    environment:
      TZ: UTC
      PGHOST: postgres
      PGPORT: '5432'
      # Superusuario: lee todo y, al restaurar, crea la base y asigna dueños
      PGUSER: argosisp
      PGPASSWORD: ${DB_PASSWORD:-argosisp}
      DB_OWNER_USER: ${DB_OWNER_USER:-argosisp_owner}
      BACKUP_BASE: argosisp
      BACKUP_HORA: ${BACKUP_HORA:-03:13}
      BACKUP_RETENCION_DIAS: ${BACKUP_RETENCION_DIAS:-14}
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      # Solo para restaurar un .age: clave privada montada (nunca en el servidor de producción a diario)
      BACKUP_AGE_IDENTITY: ${BACKUP_AGE_IDENTITY:-/config/age.key}
      BACKUP_RCLONE_DESTINO: ${BACKUP_RCLONE_DESTINO:-}
      RCLONE_CONFIG: /config/rclone.conf
      # tar de los comprobantes junto al dump (mismo cifrado y retención); restaurar.sh --comprobantes-dir
      COMPROBANTES_DIR: /comprobantes
    volumes:
      - ${BACKUP_HOST_DIR:-./backups/datos}:/backups
      # Lectura y escritura: restaurar.sh --comprobantes-dir /comprobantes los devuelve aquí
      - ${COMPROBANTES_HOST_DIR:-comprobantes}:/comprobantes
      # rclone.conf (y age.key al restaurar), solo lectura
      - ${BACKUP_CONFIG_DIR:-./backups/config}:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      comprobantes-permisos:
        condition: service_completed_successfully
    healthcheck:
      # Sano mientras el último intento no haya fallado (BACKUP_DIR/.estado lo escribe programar.sh)
      test: [CMD-SHELL, "! grep -q '^error' /backups/.estado 2>/dev/null"]
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 1m

  # Deja la carpeta de comprobantes a nombre del usuario de la app (node, uid 1000, de la imagen de
  # api): un volumen nuevo o un directorio del host nacen de root, y una restauración trae los
  # permisos del tar. Sin acceso para otros (u=rwX,g=rX,o=). Corre como root una vez por `up`.
  comprobantes-permisos:
    image: argosisp/api:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    user: '0:0'
    command: [sh, -c, 'chown -R node:node /comprobantes && chmod -R u=rwX,g=rX,o= /comprobantes']
    volumes:
      - ${COMPROBANTES_HOST_DIR:-comprobantes}:/comprobantes
    restart: 'no'

  # Migraciones de apps/api (AdonisJS) antes de levantar la API. Misma imagen que api.
  migrate:
    image: argosisp/api:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # Migraciones y seed idempotente del ACL (roles, permisos y admin de laboratorio).
    command: [sh, -c, 'node ace.js migration:run --force && node ace.js db:seed']
    # Con el dueño de la base: crea schemas y tablas y da los permisos a argosisp_app.
    environment:
      <<: *api-env
      DB_USER: ${DB_OWNER_USER:-argosisp_owner}
      DB_PASSWORD: ${DB_OWNER_PASSWORD:-argosisp_owner}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: argosisp/api:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-env
    ports:
      - 127.0.0.1:${API_PORT_HOST:-3333}:3333
    volumes:
      - ${COMPROBANTES_HOST_DIR:-comprobantes}:/comprobantes
    depends_on:
      migrate:
        condition: service_completed_successfully
      comprobantes-permisos:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))

  # Procesos de fondo: misma imagen que api, sin puerto HTTP, un proceso de ace por contenedor
  # (detalle en infra/README.md, "Procesos de fondo"). Todos esperan a migrate y a Postgres y Redis
  # sanos. Healthcheck por proceso vivo: el PID 1 del contenedor sigue siendo su comando de ace (la
  # imagen trae un HEALTHCHECK HTTP de la API que en estos procesos no aplica).

  # Relay del outbox (A1): audit.outbox → stream de Redis argos:eventos (contratos/eventos.md).
  relay:
    <<: *proceso-fondo
    command: [node, ace.js, eventos:relay]
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js eventos:relay'"]

  # Facturación (A3): consumidor del grupo billing y crons de facturas, vencimientos y corte.
  billing-worker:
    <<: *proceso-fondo
    command: [node, ace.js, billing:worker]
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js billing:worker'"]

  # FEL (A3, contrato de localización fiscal §8.3): cola `fel-cron` cada minuto con lock; pide la
  # certificación de los avisos cubiertos, envía los DTE pendientes, reintenta los de error temporal
  # y envía las anulaciones al certificador (INFILE por HTTPS saliente). Las credenciales están en
  # fiscal.fel_credenciales, cifradas con AAA_PPP_KEY (sin variables nuevas); el XML y el PDF del DTE
  # se guardan en Postgres (fiscal.dte), así que no lleva volumen. Una réplica: el lock evita dobles.
  fiscal-worker:
    <<: *proceso-fondo
    command: [node, ace.js, fiscal:worker]
    deploy:
      replicas: 1
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js fiscal:worker'"]

  # Sesiones (A2): cola de accounting de aaa → network.sesiones y eventos sesion.*.
  sesiones-worker:
    <<: *proceso-fondo
    command: [node, ace.js, sesiones:worker]
    # También corre el cron de sesiones colgadas (A2, cola sesiones-cron, lock en Postgres):
    # colgada = sin accounting en SESIONES_COLGADAS_INTERVALOS × AAA_INTERIM_SEGUNDOS.
    environment:
      <<: *api-env
      # El mismo Acct-Interim-Interval que entrega aaa (misma variable de infra/.env para los dos).
      AAA_INTERIM_SEGUNDOS: ${AAA_INTERIM_SEGUNDOS:-300}
      SESIONES_COLGADAS_INTERVALOS: ${SESIONES_COLGADAS_INTERVALOS:-3}
      # 0 apaga el cron
      SESIONES_COLGADAS_CADA_MS: ${SESIONES_COLGADAS_CADA_MS:-300000}
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js sesiones:worker'"]

  # Vigía de aaa (A2): health check de los nodos aaa; emite aaa.caido / aaa.recuperado por outbox
  # (notify los manda al chat del equipo). Perfil lab, como aaa. Una réplica basta (tiene lock).
  aaa-vigia:
    <<: *proceso-fondo
    profiles: [lab]
    command: [node, ace.js, aaa:vigilar]
    environment:
      <<: *api-env
      # nombre=url separados por coma (segundo nodo: aaa=http://aaa:3100,aaa2=http://<ip>:3100)
      AAA_SALUD_NODOS: ${AAA_SALUD_NODOS:-aaa=http://aaa:3100}
      AAA_CAIDO_TRAS_MS: ${AAA_CAIDO_TRAS_MS:-60000}
      AAA_SALUD_CADA_MS: ${AAA_SALUD_CADA_MS:-5000}
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js aaa:vigilar'"]

  # RouterOS (A2): servicios sin PPPoE por la API REST de los routers (grupo routeros del bus),
  # crons del reconciliador (cola routeros-cron) y prefijo delegado de las sesiones en modo
  # radius_pool (cola routeros-prefijos). Una réplica: los crons llevan lock. Debe alcanzar la API
  # REST de los routers (HTTPS, servicio www-ssl): en el laboratorio, por la LAN o el túnel WireGuard.
  # Usuario y contraseña de cada router salen de network.routers (cifrados con AAA_PPP_KEY); la
  # verificación TLS también es por router (api_tls_verificar, api_ca), no por variable de entorno.
  routeros-worker:
    <<: *proceso-fondo
    command: [node, ace.js, routeros:worker]
    deploy:
      replicas: 1
    environment:
      <<: *api-env
      ROUTEROS_TIMEOUT_MS: ${ROUTEROS_TIMEOUT_MS:-5000}
      ROUTEROS_REINTENTOS: ${ROUTEROS_REINTENTOS:-3}
      ROUTEROS_ESPERA_MS: ${ROUTEROS_ESPERA_MS:-500}
      ROUTEROS_SUSPENDIDO_RATE_LIMIT: ${AAA_SUSPENDIDO_RATE_LIMIT:-256k/256k}
      ROUTEROS_SUSPENDIDO_ADDRESS_LIST: ${AAA_SUSPENDIDO_ADDRESS_LIST:-suspendidos}
      ROUTEROS_INTERFAZ_CLIENTES: ${ROUTEROS_INTERFAZ_CLIENTES:-}
      ROUTEROS_DHCP_SERVIDOR: ${ROUTEROS_DHCP_SERVIDOR:-all}
      ROUTEROS_RECONCILIAR_CADA_MS: ${ROUTEROS_RECONCILIAR_CADA_MS:-900000}
      ROUTEROS_RECUPERAR_CADA_MS: ${ROUTEROS_RECUPERAR_CADA_MS:-30000}
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js routeros:worker'"]

  # Notificaciones (A6): cola de envíos, cron de recordatorios y cron mensual de particiones.
  worker:
    <<: *proceso-fondo
    command: [node, ace.js, notify:worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js notify:worker'"]

  # Conector Horus (A6): grupo `horus` del bus y entrega de webhooks firmados con reintentos.
  # Sin conector activo no envía nada (solo confirma los eventos).
  horus-worker:
    <<: *proceso-fondo
    command: [node, ace.js, horus:worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js horus:worker'"]

  web:
    image: argosisp/web:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      # Navegador → API (pública) y servidor Nuxt → API (red interna de compose)
      NUXT_PUBLIC_API_BASE: ${API_PUBLIC_URL:-http://localhost:3333}
      NUXT_API_BASE_INTERNAL: http://api:3333
    ports:
      - 127.0.0.1:${WEB_PORT_HOST:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))

  portal:
    image: argosisp/portal:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      # Vacío: el navegador llama a /api/v1/portal/** del propio portal y Nitro lo reenvía a la API
      # (mismo origen; la API no se publica a los suspendidos ni necesita CORS).
      NUXT_PUBLIC_API_BASE: ''
      NUXT_API_BASE_INTERNAL: http://api:3333
      # URL pública del portal (destino de los 302 a /corte) y hosts que se sirven sin redirigir
      NUXT_PORTAL_URL_PUBLICA: ${PORTAL_URL_PUBLICA:-}
      NUXT_PORTAL_HOSTS: ${PORTAL_HOSTS:-}
    ports:
      # Puerto normal del portal
      - ${PORTAL_BIND_IP:-127.0.0.1}:${PORTAL_PORT_HOST:-3001}:3001
      # Puerto de corte: el MikroTik hace dst-nat de TCP/80 de los suspendidos a
      # portalV4:portalCortePuerto (lab.rsc). Publicado con iptables (no userland-proxy) Docker
      # conserva la IP real del cliente, que la API necesita para /portal/quien-soy.
      # Ver infra/README.md (IP real del cliente e IPv6).
      - ${PORTAL_BIND_IP:-127.0.0.1}:${PORTAL_CORTE_PORT_HOST:-80}:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))

  aaa:
    profiles: [lab]
    image: argosisp/aaa:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: services/aaa/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TZ: UTC
      HOST: 0.0.0.0
      PORT: '3100'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Respaldo cuando Redis no tiene el servicio: api (GET /internal/aaa/servicio) o fixtures.
      AAA_RESPALDO: ${AAA_RESPALDO:-api}
      AAA_API_URL: ${AAA_API_URL:-http://api:3333/api/v1/}
      API_INTERNAL_URL: ${AAA_API_URL:-http://api:3333/api/v1/}
      # consultas simultáneas en un lote (POST internal/aaa/servicios); 0 = una GET por usuario
      AAA_API_LOTES: ${AAA_API_LOTES:-1}
      AAA_INTERNAL_TOKEN: ${AAA_INTERNAL_TOKEN:-}
      # Misma clave que el servicio api (cifra pass_ppp y radius_secret, formato v1).
      AAA_PPP_KEY: ${AAA_PPP_KEY:-}
      # Perfil de suspendido (verificado en RouterOS 7.24.5, ver infra/mikrotik/README.md)
      AAA_SUSPENDIDO_RATE_LIMIT: ${AAA_SUSPENDIDO_RATE_LIMIT:-256k/256k}
      AAA_SUSPENDIDO_GRUPO: ${AAA_SUSPENDIDO_GRUPO:-suspendido}
      AAA_SUSPENDIDO_ADDRESS_LIST: ${AAA_SUSPENDIDO_ADDRESS_LIST:-suspendidos}
      AAA_SUSPENDIDO_FILTER_ID: ${AAA_SUSPENDIDO_FILTER_ID:-argos-corte.in}
      # Acct-Interim-Interval que entrega aaa. El mismo valor va a sesiones-worker (sesiones colgadas).
      AAA_INTERIM_SEGUNDOS: ${AAA_INTERIM_SEGUNDOS:-300}
      # GET /metrics (job aaa de Prometheus). Vacío = abierto en la red interna.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    # Último perfil conocido del modo degradado (A2: AAA_DEGRADADO_RUTA de la imagen,
    # /var/lib/argosisp-aaa/ultimo-conocido.json, dueño node, 0600). Con un segundo nodo, un volumen
    # propio por nodo (aaa2-datos).
    volumes:
      - aaa-datos:/var/lib/argosisp-aaa
    ports:
      - 127.0.0.1:${AAA_PORT_HOST:-3100}:3100
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))

  coa:
    profiles: [lab]
    image: argosisp/coa:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: services/coa/Dockerfile
    restart: unless-stopped
    # Envía CoA/Disconnect a NAS:3799 por la red del host (NAT de Docker). El MikroTik solo acepta
    # peticiones entrantes desde la dirección de un /radius configurado: el tráfico debe salir del
    # host con la IP que el router tiene como servidor RADIUS (la del túnel WireGuard o de la LAN).
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TZ: UTC
      HOST: 0.0.0.0
      PORT: '3200'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${DB_APP_USER:-argosisp_api}
      DB_PASSWORD: ${DB_APP_PASSWORD:-argosisp_api}
      DB_DATABASE: argosisp
      # Descifra network.routers.radius_secret (la misma clave que api y aaa)
      AAA_PPP_KEY: ${AAA_PPP_KEY:-}
      COA_NAS_PORT: '3799'
      COA_TIMEOUT_MS: ${COA_TIMEOUT_MS:-2000}
      COA_REINTENTOS: ${COA_REINTENTOS:-3}
      # IP de origen de los CoA: la que el router tiene en /radius (túnel WireGuard o LAN)
      COA_ORIGEN_IP: ${COA_ORIGEN_IP:-}
      COA_SUSPENDIDO_RATE_LIMIT: ${AAA_SUSPENDIDO_RATE_LIMIT:-256k/256k}
      COA_SUSPENDIDO_ADDRESS_LIST: ${AAA_SUSPENDIDO_ADDRESS_LIST:-suspendidos}
      COA_SUSPENDIDO_FILTER_ID: ${AAA_SUSPENDIDO_FILTER_ID:-argos-corte.in}
      # Suspender sesiones con IPv6: coa (sin reconectar; IPv6 bloqueado con reset) o disconnect
      # (reconecta con el perfil suspendido y el router redirige IPv6 a /corte). Decide el PM.
      COA_SUSPENDER_CON_IPV6: ${COA_SUSPENDER_CON_IPV6:-coa}
      # Prefijo de aaa:user:<user_ppp> en Redis (mismo que aaa y la API): rate-limit de los CoA de velocidad
      AAA_REDIS_PREFIJO: ${AAA_REDIS_PREFIJO:-aaa:user:}
      # Respaldo por la API interna (A2) cuando Redis no tiene el servicio: GET /internal/aaa/servicio
      # con Authorization: Bearer <AAA_INTERNAL_TOKEN> (= INTERNAL_TOKEN de la API y el de aaa).
      # Nombres de services/coa/.env.example.
      API_INTERNAL_URL: ${AAA_API_URL:-http://api:3333/api/v1/}
      AAA_INTERNAL_TOKEN: ${AAA_INTERNAL_TOKEN:-}
      COA_API_TIMEOUT_MS: ${COA_API_TIMEOUT_MS:-2000}
      COA_API_REINTENTOS: ${COA_API_REINTENTOS:-3}
      COA_API_ESPERA_MS: ${COA_API_ESPERA_MS:-500}
      # GET /metrics (job coa de Prometheus). Vacío = abierto en la red interna.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - 127.0.0.1:${COA_PORT_HOST:-3200}:3200
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Respaldo del rate-limit por la API interna (no bloquea si la API tarda: service_started)
      api:
        condition: service_started
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3200/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))

  freeradius:
    profiles: [lab]
    image: freeradius/freeradius-server:3.2.10
    restart: unless-stopped
    # Log a stdout (docker logs). Para depurar: command: [-X]
    command: [-l, stdout]
    environment:
      TZ: UTC
      AAA_URL: http://aaa:3100
      RADIUS_LOCAL_SECRET: ${RADIUS_LOCAL_SECRET:-}
      RADIUS_LAB_NAS_IP: ${RADIUS_LAB_NAS_IP:-}
      RADIUS_LAB_SECRET: ${RADIUS_LAB_SECRET:-}
    volumes:
      - ../services/aaa/freeradius/mods-enabled:/etc/freeradius/mods-enabled:ro
      - ../services/aaa/freeradius/sites-enabled:/etc/freeradius/sites-enabled:ro
      - ../services/aaa/freeradius/clients.conf:/etc/freeradius/clients.conf:ro
      - ../services/aaa/freeradius/clients.d:/etc/freeradius/clients.d:ro
    ports:
      - ${RADIUS_BIND_IP:-127.0.0.1}:1812:1812/udp
      - ${RADIUS_BIND_IP:-127.0.0.1}:1813:1813/udp
    depends_on:
      aaa:
        condition: service_healthy
    healthcheck:
      # Status-Server al puerto de autenticación con el cliente localhost.
      test:
        - CMD-SHELL
        - echo 'Message-Authenticator = 0x00' | radclient -q -c 1 -r 1 -t 2 127.0.0.1:1812 status "$$RADIUS_LOCAL_SECRET"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Perfil publico: proxy con TLS para la API (incluido el webhook de la pasarela, con el cuerpo
  # crudo) y el panel. El portal no pasa por aquí (necesita la IP real del cliente). infra/proxy/
  proxy:
    profiles: [publico]
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      PROXY_DOMINIO_API: ${PROXY_DOMINIO_API:-api.localhost}
      PROXY_DOMINIO_PANEL: ${PROXY_DOMINIO_PANEL:-panel.localhost}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      # En producción 80 y 443 en la IP pública (distinta de PORTAL_BIND_IP, que usa el 80 del portal)
      - ${PROXY_BIND_IP:-127.0.0.1}:${PROXY_HTTP_PORT:-8080}:80
      - ${PROXY_BIND_IP:-127.0.0.1}:${PROXY_HTTPS_PORT:-8443}:443
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 3s
      retries: 5

  # Perfil monitoreo: Prometheus con las métricas de la API y las reglas de infra/monitoring.
  prometheus:
    profiles: [monitoreo]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    # El token no puede ir en prometheus.yml (no expande variables): se escribe a un archivo al arrancar.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf '%s' "$$METRICS_TOKEN" > /tmp/metrics_token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=$${PROMETHEUS_RETENCION:-30d}
        --rules.alert.resend-delay=15s
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PROMETHEUS_RETENCION: ${PROMETHEUS_RETENCION:-30d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/reglas.yml:/etc/prometheus/reglas.yml:ro
      - promdata:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT_HOST:-9090}:9090
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 15s
      timeout: 3s
      retries: 5

  # Perfil monitoreo: Alertmanager manda las alertas de Prometheus al chat del equipo por Telegram
  # (receptor nativo telegram_configs, no la API: debe avisar justo cuando la API o Redis se caen).
  # Mismo bot (TELEGRAM_BOT_TOKEN) y chat (TELEGRAM_CHAT_EQUIPO) que las alertas de negocio de notify.
  # Configuración en infra/monitoring/alertmanager/; prueba de punta a punta: infra/monitoring/probar-alertas.sh
  alertmanager:
    profiles: [monitoreo]
    # Imagen oficial en quay.io (el mismo build que prom/alertmanager, sin el límite de Docker Hub)
    image: quay.io/prometheus/alertmanager:v0.28.1
    restart: unless-stopped
    entrypoint: [/bin/sh, /etc/alertmanager/entrypoint.sh]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_EQUIPO: ${TELEGRAM_CHAT_EQUIPO:-}
      TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-}
      ALERTMANAGER_RETENCION: ${ALERTMANAGER_RETENCION:-120h}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - amdata:/alertmanager
    ports:
      - 127.0.0.1:${ALERTMANAGER_PORT_HOST:-9093}:9093
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9093/-/ready']
      interval: 15s
      timeout: 3s
      retries: 5

# Red por defecto con subred fija: PORTAL_PROXIES_CONFIABLES de la API la usa para confiar en el
# X-Forwarded-For que agrega el portal. IPv6 en la red: COMPOSE_IPV6=true (perfil lab, ver infra/README.md).
networks:
  default:
    enable_ipv6: ${COMPOSE_IPV6:-false}
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET_V4:-172.30.0.0/24}
        - subnet: ${COMPOSE_SUBNET_V6:-fd00:a6:30::/64}

volumes:
  pgdata:
  redisdata:
  promdata:
  amdata:
  # Certificados y estado de Caddy (servicio proxy)
  caddydata:
  caddyconfig:
  # Último perfil conocido de aaa (modo degradado)
  aaa-datos:
  # Comprobantes de depósito (api): ver COMPROBANTES_HOST_DIR en .env.example
  comprobantes:
