# ArgosIsp · entorno de desarrollo y laboratorio.
#
#   cp infra/.env.example infra/.env      # y completa los valores
#   docker compose -f infra/docker-compose.yml up -d postgres redis mailpit
#   docker compose -f infra/docker-compose.yml up -d            # todo (perfil lab si COMPOSE_PROFILES=lab)
#
# Perfil "lab": freeradius, aaa y coa. FreeRADIUS publica UDP 1812/1813 en RADIUS_BIND_IP
# (127.0.0.1 por defecto; en el laboratorio, la IP del servidor en la LAN o en el túnel WireGuard
# hacia el MikroTik). Detalle en infra/mikrotik/README.md.
#
# Los builds usan como contexto la raíz del repo (..), con el Dockerfile de cada app o servicio.

name: argosisp

x-node-healthcheck: &node-healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

# Healthcheck de los procesos de fondo (cada servicio agrega su `test`).
x-proceso-vivo: &proceso-vivo
  interval: 30s
  timeout: 3s
  retries: 3
  start_period: 30s

# Entorno común de la imagen de api (migrate, api y procesos de fondo).
x-api-env: &api-env
  # La imagen de api es un build de producción (sin devDependencies como pino-pretty).
  NODE_ENV: production
  TZ: UTC
  HOST: 0.0.0.0
  PORT: '3333'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${API_PUBLIC_URL:-http://localhost:3333}
  DB_HOST: postgres
  DB_PORT: '5432'
  # Usuario de la aplicación: miembro de argosisp_app, sin DDL ni UPDATE/DELETE en ledger y audit
  # (infra/postgres/usuarios.sh). migrate lo reemplaza por el dueño.
  DB_USER: ${DB_APP_USER:-argosisp_api}
  DB_PASSWORD: ${DB_APP_PASSWORD:-argosisp_api}
  DB_DATABASE: argosisp
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  MAIL_FROM: ${MAIL_FROM:-ArgosIsp <no-responder@argosisp.example>}
  # Notificaciones (apps/api/app/notify). Sin TELEGRAM_BOT_TOKEN el canal Telegram no se usa
  # y los clientes con esa preferencia reciben correo.
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  NOTIFY_EMPRESA_NOMBRE: ${NOTIFY_EMPRESA_NOMBRE:-ArgosIsp}
  NOTIFY_EMPRESA_TELEFONO: ${NOTIFY_EMPRESA_TELEFONO:-}
  NOTIFY_PORTAL_URL: ${NOTIFY_PORTAL_URL:-}
  # Token de GET /internal/aaa/servicio; el mismo valor que usa services/aaa.
  INTERNAL_TOKEN: ${AAA_INTERNAL_TOKEN:-}
  AAA_PPP_KEY: ${AAA_PPP_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
  # /portal/quien-soy: confiar en X-Forwarded-For solo si la conexión viene de la red de compose
  # (el portal reenvía /api/v1/portal/** y agrega la IP del cliente al final de la cadena).
  PORTAL_PROXIES_CONFIABLES: ${PORTAL_PROXIES_CONFIABLES:-172.30.0.0/24,fd00:a6:30::/64}
  PORTAL_CABECERA_IP: x-forwarded-for
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

# Procesos de fondo con la imagen de api (relay, billing-worker, sesiones-worker, worker).
x-proceso-fondo: &proceso-fondo
  image: argosisp/api:${IMAGE_TAG:-dev}
  build:
    context: ..
    dockerfile: apps/api/Dockerfile
  restart: unless-stopped
  environment: *api-env
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: argosisp
      # Superusuario: solo administración y la base de pruebas argosisp_test. Ninguna app lo usa.
      POSTGRES_USER: argosisp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-argosisp}
      TZ: UTC
      # Usuarios que crea usuarios.sh: dueño (migrate) y aplicación (api, workers, coa)
      DB_OWNER_USER: ${DB_OWNER_USER:-argosisp_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-argosisp_owner}
      DB_APP_USER: ${DB_APP_USER:-argosisp_api}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-argosisp_api}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./postgres/usuarios.sh:/docker-entrypoint-initdb.d/20-usuarios.sh:ro
    ports:
      - 127.0.0.1:${DB_PORT_HOST:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U argosisp -d argosisp]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    # Sin TTL ni expulsión: la caché se invalida por evento (CLAUDE.md, regla 5) y BullMQ exige
    # noeviction. maxmemory 0 = sin límite. AOF para no perder colas ni streams al reiniciar.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - '0'
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    ports:
      - 127.0.0.1:${REDIS_PORT_HOST:-6379}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      TZ: UTC
    ports:
      - 127.0.0.1:${SMTP_PORT_HOST:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT_HOST:-8025}:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 3s
      retries: 5

  # Migraciones de apps/api (AdonisJS) antes de levantar la API. Misma imagen que api.
  migrate:
    image: argosisp/api:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # Migraciones y seed idempotente del ACL (roles, permisos y admin de laboratorio).
    command: [sh, -c, 'node ace.js migration:run --force && node ace.js db:seed']
    # Con el dueño de la base: crea schemas y tablas y da los permisos a argosisp_app.
    environment:
      <<: *api-env
      DB_USER: ${DB_OWNER_USER:-argosisp_owner}
      DB_PASSWORD: ${DB_OWNER_PASSWORD:-argosisp_owner}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: argosisp/api:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-env
    ports:
      - 127.0.0.1:${API_PORT_HOST:-3333}:3333
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))

  # Procesos de fondo: misma imagen que api, sin puerto HTTP, un proceso de ace por contenedor
  # (detalle en infra/README.md, "Procesos de fondo"). Todos esperan a migrate y a Postgres y Redis
  # sanos. Healthcheck por proceso vivo: el PID 1 del contenedor sigue siendo su comando de ace (la
  # imagen trae un HEALTHCHECK HTTP de la API que en estos procesos no aplica).

  # Relay del outbox (A1): audit.outbox → stream de Redis argos:eventos (contratos/eventos.md).
  relay:
    <<: *proceso-fondo
    command: [node, ace.js, eventos:relay]
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js eventos:relay'"]

  # Facturación (A3): consumidor del grupo billing y crons de facturas, vencimientos y corte.
  billing-worker:
    <<: *proceso-fondo
    command: [node, ace.js, billing:worker]
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js billing:worker'"]

  # Sesiones (A2): cola de accounting de aaa → network.sesiones y eventos sesion.*.
  sesiones-worker:
    <<: *proceso-fondo
    command: [node, ace.js, sesiones:worker]
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js sesiones:worker'"]

  # Notificaciones (A6): cola de envíos, cron de recordatorios y cron mensual de particiones.
  worker:
    <<: *proceso-fondo
    command: [node, ace.js, notify:worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      <<: *proceso-vivo
      test: [CMD-SHELL, "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'ace.js notify:worker'"]

  web:
    image: argosisp/web:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      # Navegador → API (pública) y servidor Nuxt → API (red interna de compose)
      NUXT_PUBLIC_API_BASE: ${API_PUBLIC_URL:-http://localhost:3333}
      NUXT_API_BASE_INTERNAL: http://api:3333
    ports:
      - 127.0.0.1:${WEB_PORT_HOST:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))

  portal:
    image: argosisp/portal:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      # Vacío: el navegador llama a /api/v1/portal/** del propio portal y Nitro lo reenvía a la API
      # (mismo origen; la API no se publica a los suspendidos ni necesita CORS).
      NUXT_PUBLIC_API_BASE: ''
      NUXT_API_BASE_INTERNAL: http://api:3333
      # URL pública del portal (destino de los 302 a /corte) y hosts que se sirven sin redirigir
      NUXT_PORTAL_URL_PUBLICA: ${PORTAL_URL_PUBLICA:-}
      NUXT_PORTAL_HOSTS: ${PORTAL_HOSTS:-}
    ports:
      # Puerto normal del portal
      - ${PORTAL_BIND_IP:-127.0.0.1}:${PORTAL_PORT_HOST:-3001}:3001
      # Puerto de corte: el MikroTik hace dst-nat de TCP/80 de los suspendidos a
      # portalV4:portalCortePuerto (lab.rsc). Publicado con iptables (no userland-proxy) Docker
      # conserva la IP real del cliente, que la API necesita para /portal/quien-soy.
      # Ver infra/README.md (IP real del cliente e IPv6).
      - ${PORTAL_BIND_IP:-127.0.0.1}:${PORTAL_CORTE_PORT_HOST:-80}:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))

  aaa:
    profiles: [lab]
    image: argosisp/aaa:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: services/aaa/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TZ: UTC
      HOST: 0.0.0.0
      PORT: '3100'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Respaldo cuando Redis no tiene el servicio: api (GET /internal/aaa/servicio) o fixtures.
      AAA_RESPALDO: ${AAA_RESPALDO:-api}
      AAA_API_URL: ${AAA_API_URL:-http://api:3333/api/v1/}
      API_INTERNAL_URL: ${AAA_API_URL:-http://api:3333/api/v1/}
      AAA_INTERNAL_TOKEN: ${AAA_INTERNAL_TOKEN:-}
      # Misma clave que el servicio api (cifra pass_ppp y radius_secret, formato v1).
      AAA_PPP_KEY: ${AAA_PPP_KEY:-}
      # Perfil de suspendido (verificado en RouterOS 7.24.5, ver infra/mikrotik/README.md)
      AAA_SUSPENDIDO_RATE_LIMIT: ${AAA_SUSPENDIDO_RATE_LIMIT:-256k/256k}
      AAA_SUSPENDIDO_GRUPO: ${AAA_SUSPENDIDO_GRUPO:-suspendido}
      AAA_SUSPENDIDO_ADDRESS_LIST: ${AAA_SUSPENDIDO_ADDRESS_LIST:-suspendidos}
      AAA_SUSPENDIDO_FILTER_ID: ${AAA_SUSPENDIDO_FILTER_ID:-argos-corte.in}
    ports:
      - 127.0.0.1:${AAA_PORT_HOST:-3100}:3100
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))

  coa:
    profiles: [lab]
    image: argosisp/coa:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: services/coa/Dockerfile
    restart: unless-stopped
    # Envía CoA/Disconnect a NAS:3799 por la red del host (NAT de Docker). El MikroTik solo acepta
    # peticiones entrantes desde la dirección de un /radius configurado: el tráfico debe salir del
    # host con la IP que el router tiene como servidor RADIUS (la del túnel WireGuard o de la LAN).
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TZ: UTC
      HOST: 0.0.0.0
      PORT: '3200'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${DB_APP_USER:-argosisp_api}
      DB_PASSWORD: ${DB_APP_PASSWORD:-argosisp_api}
      DB_DATABASE: argosisp
      COA_NAS_PORT: '3799'
    ports:
      - 127.0.0.1:${COA_PORT_HOST:-3200}:3200
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3200/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))

  freeradius:
    profiles: [lab]
    image: freeradius/freeradius-server:3.2.10
    restart: unless-stopped
    # Log a stdout (docker logs). Para depurar: command: [-X]
    command: [-l, stdout]
    environment:
      TZ: UTC
      AAA_URL: http://aaa:3100
      RADIUS_LOCAL_SECRET: ${RADIUS_LOCAL_SECRET:-}
      RADIUS_LAB_NAS_IP: ${RADIUS_LAB_NAS_IP:-}
      RADIUS_LAB_SECRET: ${RADIUS_LAB_SECRET:-}
    volumes:
      - ../services/aaa/freeradius/mods-enabled:/etc/freeradius/mods-enabled:ro
      - ../services/aaa/freeradius/sites-enabled:/etc/freeradius/sites-enabled:ro
      - ../services/aaa/freeradius/clients.conf:/etc/freeradius/clients.conf:ro
      - ../services/aaa/freeradius/clients.d:/etc/freeradius/clients.d:ro
    ports:
      - ${RADIUS_BIND_IP:-127.0.0.1}:1812:1812/udp
      - ${RADIUS_BIND_IP:-127.0.0.1}:1813:1813/udp
    depends_on:
      aaa:
        condition: service_healthy
    healthcheck:
      # Status-Server al puerto de autenticación con el cliente localhost.
      test:
        - CMD-SHELL
        - echo 'Message-Authenticator = 0x00' | radclient -q -c 1 -r 1 -t 2 127.0.0.1:1812 status "$$RADIUS_LOCAL_SECRET"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Red por defecto con subred fija: PORTAL_PROXIES_CONFIABLES de la API la usa para confiar en el
# X-Forwarded-For que agrega el portal. IPv6 en la red: COMPOSE_IPV6=true (perfil lab, ver infra/README.md).
networks:
  default:
    enable_ipv6: ${COMPOSE_IPV6:-false}
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET_V4:-172.30.0.0/24}
        - subnet: ${COMPOSE_SUBNET_V6:-fd00:a6:30::/64}

volumes:
  pgdata:
  redisdata:
