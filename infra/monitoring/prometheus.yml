# Prometheus de ArgosIsp (servicio `prometheus`, perfil `monitoreo` del compose). infra/monitoring/README.md
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/reglas.yml

scrape_configs:
  # API: colas BullMQ, lag del stream argos:eventos, outbox, última corrida de cada cron, incidentes.
  # El token (METRICS_TOKEN) lo escribe el entrypoint del servicio en /tmp/metrics_token.
  - job_name: api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ['api:3333']

  # aaa (A2): autorizaciones por resultado, latencia (histograma), accounting y Redis arriba.
  # Mismo METRICS_TOKEN: aaa y coa lo exigen si tiene valor y lo ignoran si está vacío.
  # Perfil lab: sin aaa ni coa levantados, sus targets quedan en down (alerta ServicioSinMetricas).
  - job_name: aaa
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ['aaa:3100']

  # coa (A2): envíos CoA/Disconnect por tipo y resultado, RTT, eventos pendientes y consumidor activo.
  - job_name: coa
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ['coa:3200']
