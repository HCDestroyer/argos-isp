# Reglas de alerta de Prometheus. Las alertas de negocio que el equipo debe ver en Telegram las
# manda notify (aaa caído, CoA fallido, caja con diferencia, crons atrasados); estas cubren lo que
# notify no puede ver de sí mismo (la API o Redis caídos, colas atascadas) y las envía Alertmanager
# (alertmanager/, receptor telegram_configs) al mismo chat del equipo.
groups:
  - name: argosisp
    rules:
      - alert: ApiSinMetricas
        expr: up{job="api"} == 0
        for: 2m
        annotations:
          summary: La API no responde /metrics

      - alert: SeccionDeMetricasFallando
        expr: argosisp_metricas_error == 1
        for: 5m
        annotations:
          summary: 'No se puede leer la sección {{ $labels.seccion }} (Postgres o Redis)'

      - alert: ColaAtascada
        expr: argosisp_cola_trabajos{estado="waiting"} > 500
        for: 10m
        annotations:
          summary: 'Cola {{ $labels.cola }} con {{ $value }} trabajos esperando'

      - alert: TrabajosFallidos
        expr: increase(argosisp_cola_trabajos{estado="failed"}[30m]) > 20
        annotations:
          summary: 'Cola {{ $labels.cola }}: más de 20 trabajos fallidos en 30 min'

      - alert: GrupoDeEventosAtrasado
        expr: argosisp_eventos_lag > 1000 or argosisp_eventos_pendientes > 100
        for: 5m
        annotations:
          summary: 'El grupo {{ $labels.grupo }} no consume argos:eventos'

      - alert: OutboxSinPublicar
        expr: argosisp_outbox_sin_publicar > 100
        for: 5m
        annotations:
          summary: 'audit.outbox acumula {{ $value }} eventos sin publicar (¿relay detenido?)'

      - alert: CronDeFacturacionAtrasado
        expr: time() - argosisp_cron_ultima_ejecucion_timestamp_seconds{cron=~"facturas.generar|facturas.vencer_pendientes"} > 2 * 3600
        annotations:
          summary: '{{ $labels.cron }} no corre hace más de 2 h'

      - alert: CronDeNotifyAtrasado
        expr: time() - argosisp_cron_ultima_ejecucion_timestamp_seconds{cron=~"notificaciones.recordatorios|notificaciones.vigilar_crons"} > 900
        annotations:
          summary: '{{ $labels.cron }} no corre hace más de 15 min (¿worker de notify detenido?)'

      # contratos/velocidad.md: más de ~1000 colas simples en un router es alerta; pasar a arbol_pcq.
      # La métrica la expone A2 (sección `routeros` de /metrics, .claude/integration/a6.md).
      - alert: RouterDemasiadasColasSimples
        expr: argosisp_routeros_colas_simples > 1000
        for: 15m
        annotations:
          summary: 'Router {{ $labels.router }} con {{ $value }} colas simples: pasarlo a arbol_pcq (contratos/velocidad.md)'

      - alert: RouterColasSinLeer
        expr: time() - argosisp_routeros_colas_leidas_timestamp_seconds > 3600
        annotations:
          summary: 'Hace más de 1 h que no se cuentan las colas del router {{ $labels.router }} (¿reconciliador detenido o router sin API?)'

      # aaa y coa (A2, jobs aaa y coa de prometheus.yml; perfil lab del compose)
      - alert: ServicioSinMetricas
        expr: up{job=~"aaa|coa"} == 0
        for: 2m
        annotations:
          summary: '{{ $labels.job }} no responde /metrics (¿caído o METRICS_TOKEN distinto?)'

      - alert: AaaSinRedis
        expr: argosisp_aaa_redis_arriba == 0
        for: 1m
        annotations:
          summary: 'aaa ({{ $labels.instance }}) sin Redis: autoriza por el respaldo de la API'

      # Objetivo de A2: p95 de /aaa/authorize por debajo de 100 ms
      - alert: AaaLatenciaAlta
        expr: histogram_quantile(0.95, sum by (le) (rate(argosisp_aaa_autorizacion_duracion_segundos_bucket[5m]))) > 0.1
        for: 10m
        annotations:
          summary: 'p95 de autorización de aaa en {{ $value | humanizeDuration }} (objetivo < 100 ms)'

      - alert: CoaConsumidorInactivo
        expr: argosisp_coa_consumidor_activo == 0
        for: 2m
        annotations:
          summary: 'coa no consume el grupo coa de argos:eventos: los cortes y reactivaciones no llegan al router'
